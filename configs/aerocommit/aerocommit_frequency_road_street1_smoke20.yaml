inherit_from: "configs/aerocommit/aerocommit_mvp_road_street1_smoke20.yaml"

Dataset:
  name: "HorizonGS-road-street1-aerocommit-frequency-smoke20"

Testset:
  name: "HorizonGS-road-street1-aerocommit-frequency-smoke20"

Mapper:
  post_refinement:
    max_steps: 200
    opt_cam: true
    use_all_frames: true
    all_frame_batch_size: 4
    all_frame_hard_fraction: 0.50
    all_frame_hard_warmup_steps: 50
    anchor_first_pose: true
    detail_l1_weight: 0.20
    detail_gradient_weight: 0.10
    detail_gradient_threshold: 0.04
    detail_near_depth_m: 60.0
    detail_low_opacity_threshold: 0.15

Model:
  sh_degree: 1
