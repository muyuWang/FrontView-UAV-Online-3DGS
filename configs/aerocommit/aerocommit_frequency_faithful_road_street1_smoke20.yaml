inherit_from: "configs/aerocommit/aerocommit_mvp_road_street1_smoke20.yaml"

Dataset:
  name: "HorizonGS-road-street1-aerocommit-frequency-faithful-smoke20"

Testset:
  name: "HorizonGS-road-street1-aerocommit-frequency-faithful-smoke20"

Mapper:
  post_refinement:
    max_steps: 200
    opt_cam: false
    use_all_frames: false
    sampling_method: err_idx_diff
    # High-frequency evidence may update appearance and footprint, not geometry.
    means_lr_init: 0.0
    means_lr_final: 0.0
    quats_lr: 0.0
    scales_lr_init: 0.004
    scales_lr_final: 0.001
    opacities_lr: 0.05
    sh_lr: 0.005
    detail_l1_weight: 0.05
    detail_gradient_weight: 0.05
    detail_laplacian_fine_weight: 0.15
    detail_laplacian_coarse_weight: 0.05
    detail_gradient_threshold: 0.035
    detail_near_depth_m: 60.0
    detail_low_opacity_threshold: 0.0
    detail_min_opacity: 0.30
    detail_side_start: 0.45
    detail_side_boost: 1.75

Model:
  sh_degree: 0
