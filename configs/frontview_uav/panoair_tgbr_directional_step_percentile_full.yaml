inherit_from: "configs/frontview_uav/panoair_tgbr_compute_routed_cap60_full.yaml"

Dataset:
  name: "PanoAir-tgbr-directional-step-percentile-full"

Testset:
  name: "PanoAir-tgbr-directional-step-percentile-full"

StreamingAppearanceLOD:
  directional_step_budget_enabled: true
  directional_step_budget_selection_mode: "percentile"
  directional_step_budget_warmup_keyframes: 8
  directional_step_budget_very_low_steps: 6
  directional_step_budget_low_steps: 8
  directional_step_budget_percentile_window: 64
  directional_step_budget_percentile_very_low_fraction: 0.30
  directional_step_budget_percentile_low_fraction: 0.40
  directional_step_budget_lr_compensation: true
