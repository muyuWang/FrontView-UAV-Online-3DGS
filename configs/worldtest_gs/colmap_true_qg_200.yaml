Testset:
  name: "PanoAir-seq1-worldtest-qg-colmap-200"
  type: "aria"
  data_source: "orb"
  dataset_path: "/home/wmy/workspace_vla/Online-3DGS-Monocular/data/Online3DGS_PanoAir/seq1_colmap_consistent"
  num_threads: 0
  begin_cutoff: 0
  end_cutoff: 2168
  stride: 1
  max_pts_num: 5000
  vignette: false
