Results:
  save_dir: "./Logs_worldtest_gs"
  save_gt: false
  save_exr: false
  save_mesh: false
  skip_eval: true

Mapper:
  device: "cuda:0"
  active_window_size: 1
  coarse_active_window_size: 1
  coarse_level_interval: 5
  coarse_pool_size: 10
  add_gaussians_interval: 0
  prune_interval: 100
  initialization_frames: 4
  group_max_gaussian_frames: 100000000
  interactive_visualization: none
  save_model_interval: 100000000
  use_multi_reso: false
  use_dataset: true
  pin_kf_gpu: false
  optimization_iters: 10
  initialization_iters: 20
  force_keyframes_through_frame: 199
  FrameChecker:
    use_frame_checker: false
    rot_speed_threshold: 10
    pts_num_threshold: 10
  KFGraph:
    kf_selection_method: "overlap_mixed"
    kf_overlap_ratio: 0.95
    kf_interval: 1
    global_window_size: 4
    get_next_camera_method: "err_idx_diff"
    pos_clamp: 1
    pos_sigma: 10
    cov_clamp: 0.75
    cov_eps: 0.00001
    err_sigma: 50
    ris_size: 10
    idx_diff_sigma: 0.001
  CameraOptimizer:
    use_camera_opt: false
    max_num: 8192
    use_hierarchy: false
    lr: 0.00001
    weight_decay: 0.0
    pose_refine_init_steps: 0
    pose_opt_steps: 0
    device: "cuda:0"
  post_refinement:
    max_steps: 300
    opt_cam: false
    means_lr_init: 0.00004
    means_lr_final: 0.0000004
    scales_lr_init: 0.003
    scales_lr_final: 0.001
    quats_lr: 0.001
    opacities_lr: 0.05
    sh_lr: 0.005
    pose_prepass_enabled: false
    use_all_frames: true
    all_frame_batch_size: 4
    all_frame_hard_fraction: 0.75
    all_frame_hard_warmup_steps: 40
    all_frame_min_uniform_replays: 2
    all_frame_frequency_error_weight: 1.0
    all_frame_frequency_gradient_threshold: 0.035
    all_frame_frequency_side_start: 0.35
    appearance_only_start_step: 160
    appearance_freeze_scales: true
    detail_loss_start_step: 120
    detail_l1_weight: 0.10
    detail_gradient_weight: 0.05
    detail_laplacian_fine_weight: 0.0
    detail_laplacian_coarse_weight: 0.0
    detail_gradient_threshold: 0.035
    detail_near_depth_m: 120.0
    detail_low_opacity_threshold: 0.10
    detail_min_opacity: 0.05
    detail_side_start: 0.35
    detail_side_boost: 2.0
    stable_detail_split:
      enabled: true
      max_views: 48
      max_candidates_per_view: 8192
      min_support_views: 2
      max_splits: 8192
      near_depth_m: 120.0
      min_projected_radius_px: 4.0
      gradient_threshold: 0.025
      residual_threshold: 0.08
      side_start: 0.20
      child_scale_ratio: 0.55
      child_offset_fraction: 0.30

Loss:
  device: "cuda:0"
  color_loss_type: "l1"
  lambda_ssim: 0.2
  use_tonemap: false
  mu: 8
  lambda_g: 1.0
  g_loss_type: "min_constraint"
  min_scale_ratio: 10
  lambda_depth: 0.0
  lambda_normal: 0.0
  lambda_distortion: 0.0
  lambda_normal_reg: 0.0
  normal_reg_threshold: 0.02

Model:
  gaussian_type: "3dgs"
  sh_degree: 2
  use_anti_aliasing: true
  render_mode: "RGB+ED"
  device: "cuda:0"
  radius_clip: 0
  init_scale_size: -6
  densification_mode: "sparse_points_only"
  init_scale_offset: 0.5
  err_threshold: 0.05
  semi_dense_err_threshold: 0.0
  camera_scale_rescalar: 0.25
  opacity_prune_threshold: 0.01
  scene_scale: 1.0
  gaussian_pos_schedule_steps: 0
  init_gaussian_config:
    means_lr_init: 0.00004
    means_lr_final: 0.00004
    scales_lr_init: 0.003
    scales_lr_final: 0.003
    quats_lr_init: 0.001
    quats_lr_final: 0.001
    opacities_lr: 0.05
    sh_lr: 0.0025
    max_scale_expansion: 2.0
  frequency_sampling:
    enabled: false
    preserve_sparse_track_geometry: true

HashBlock:
  use_hash: true
  start_scale: 20
  hash_size: 512
  hash_level: 8
  use_color_hash: false
  color_hash_size: 2
  remove_conflict: true

AeroCommit:
  enabled: true
  mode: "aerocommit_mvp"
  bootstrap_frames: 5
  diagnostic_allow_unsafe_hybrid: false
  admission:
    policy: "immediate"
    trusted_sparse_fast_path: true
    trusted_depthcov_fast_path: false
    allow_depthcov_candidates: false
    gate_interval: 1
    min_support: 3
    max_support_edges: 4
    max_risk_candidates_per_keyframe: 128
    candidate_group_cell_px: 128
    candidate_group_log_depth_bin: 0.5
    max_candidate_groups_per_frame: 320
    max_candidate_bank_size: 3000
    fast_path_max_gaussians_per_frame: 1200
    fast_path_frequency_fraction: 0.5
    fast_path_group_frames: 20
    fast_path_initial_opacity: 0.25
  commit_refinement:
    enabled: false
    max_commits_per_keyframe: 128
    iterations: 1
    learning_rate: 0.05
    max_depth_correction_ratio: 0.2
    color_fusion_strength: 0.35
    initial_opacity: 0.25
    force_new_group: true
    group_chunk_keyframes: 20
    newborn_optimization_iters: 0
    newborn_multiview: false
  detail_refinement:
    enabled: false
    child_count: 4
  track_detail:
    enabled: false
  surface_detail:
    enabled: false
  flow_detail:
    enabled: false
  budget:
    enabled: true
    max_candidate_bank_size: 3000
    max_active_trainable_gaussians: 350000
    max_active_trainable_bytes: null
    archive_after_unseen_frames: 1000000
  archive:
    enabled: false
    cpu_dtype: "float16"
    enable_reactivation: false
    archive_directory: null
  debug:
    enabled: true
    save_interval: 10
    log_candidate_stats: true
    log_memory_breakdown: true

WorldTestGS:
  enabled: true
  admission_mode: "true_qg"
  allow_invalid_world_stress: false
  calibration_version: "panoair_v1"
  qg_threshold: 2.9444389791664403
  min_views: 3
  max_views: 8
  max_groups: 12000
  max_evaluations_per_frame: 256
  max_commits_per_frame: 256
  freeze_committed_means: false
  committed_mean_trust_radius_m: 0.05
  offline_sparse_track_cache: true
  offline_cache_frames: 200
  candidate_max_age: 60
  flow_cycle_threshold_px: 1.5
  minimum_parallax_deg: 0.2
  rank_ratio_threshold: 0.000001
  pixel_sigma: 1.0
  inverse_depth_sigma_floor: 0.001
  pose_rotation_sigma_deg: 0.5
  pose_translation_sigma_m: 0.01
  nuisance_window_frames: 16
  nuisance_update_interval: 4
  nuisance_knot_stride: 4
  nuisance_huber_delta: 3.0
  nuisance_damping: 0.000001
  prior_scales: [0.5, 1.0, 2.0]
  scene_prior_near: 0.05
  scene_prior_far: 120.0
  shadow_alpha_cap: 0.1
  schedule_path: null
  random_seed: 42
  debug: true

BackgroundModel:
  enabled: true
  observation_top_fraction: 0.4
  render_top_fraction: 0.35
  frame_stride: 1
