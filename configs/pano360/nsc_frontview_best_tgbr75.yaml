inherit_from: "data/Online3DGS_pano360/NSC/config.yaml"

Dataset:
  name: "Pano360-NSC-FrontViewBest-TGBR75"
  dataset_path: "/home/wmy/workspace_vla/Online-3DGS-Monocular/data/Online3DGS_pano360/NSC"
  max_pts_num: 1500

Testset:
  name: "Pano360-NSC-FrontViewBest-TGBR75"
  dataset_path: "/home/wmy/workspace_vla/Online-3DGS-Monocular/data/Online3DGS_pano360/NSC"
  max_pts_num: 1500

Results:
  save_dir: "/home/wmy/workspace_vla/Online-3DGS-Monocular/Logs_pano360_nsc_best_tgbr75"
  save_gt: false
  save_exr: false
  save_mesh: false
  skip_eval: true

Mapper:
  use_multi_reso: false
  pin_kf_gpu: false
  initialization_frames: 4
  optimization_iters: 10
  initialization_iters: 10
  post_refinement:
    max_steps: 100
    opt_cam: false
  KFGraph:
    kf_interval: 1
    global_window_size: 4
  CameraOptimizer:
    pose_refine_init_steps: 0
    pose_opt_steps: 4

Model:
  sh_degree: 3
  extra_pts_num: 1200
  err_threshold: 0.05
  camera_scale_rescalar: 0.25
  scene_scale: 1.0
  frequency_sampling:
    preserve_sparse_track_geometry: false

HashBlock:
  use_hash: false

FrontViewCoverageRecovery:
  enabled: true
  min_frame_gap: 40
  min_translation_m: 1.0
  min_rotation_deg: 3.0
  residual_threshold: 0.08
  min_failure_fraction: 0.15
  opacity_threshold: 0.50
  depth_fallback_enabled: true
  depth_prior_window_frames: 240
  depth_prior_quantile: 0.90
  depth_prior_min_m: 2.0
  depth_prior_max_m: 30.0
  depth_fallback_min_valid: 128
  depth_fallback_confidence: 0.50
  depth_fallback_cell_px: 18
  depth_fallback_scale_multiplier: 10.0
  depth_fallback_motion_floor_enabled: true
  depth_fallback_max_projected_drift_px: 8.0
  depth_fallback_motion_floor_max_m: 30.0
  depth_fallback_map_enabled: false
  newborn_optimization_iters: 5
  newborn_max_scale_expansion: 1.0
  newborn_freeze_positions: true
  tracking_update_interval: 5
  tracking_optimization_iters: 1

FrontViewSampling:
  enabled: true
  selection_mode: "depth_stratified"
  pool_multiplier: 2
  evidence_fraction: 0.50
  reference_frames: 2
  photo_sigma: 0.08
  photo_mode: "consistency"
  parallax_reference_deg: 2.0
  parallax_floor: 0.25
  confidence_power: 1.0
  shuffle_evidence: false
  shuffle_seed: 42
  depth_edges_m: [2.0, 5.0]
  depth_fractions: [0.25, 0.45, 0.30]

FrontViewFarField:
  enabled: true
  depth_m: 8.0
  projective_cell_px: 12
  depth_bin_ratio: 1.10
  responsibility_basis: "source"
  shuffle_responsibility: false
  shuffle_seed: 42

FrontViewScaleCover:
  enabled: true
  radius_multiplier: 0.3
  scale_compatibility: 1.0
  neighbors: 32
  rebuild_rows: 8192
  color_distance_threshold: 0.15
  sparse_track_identity_enabled: false
  shuffle_occupancy: false
  shuffle_seed: 42

StreamingAppearanceLOD:
  enabled: true
  birth_degree: 2
  target_degree: 3
  min_views: 2
  max_target_fraction: 0.75
  promotion_interval: 10
  selection_mode: "gradient_agreement"
  utility_ema_decay: 0.9
  shuffle_seed: 43
  compute_routing: false
  bounded_replay_residency_enabled: false

FrontViewDirectionalLayer:
  enabled: true
  sparse_point_threshold: 10
  anchor_interval_frames: 20
  max_anchors: 12
  min_anchors: 2
  far_depth_m: 8.0
  low_opacity_threshold: 0.50
  consistency_threshold: 0.12
  blend_weight: 0.75
  exclude_exact_frame: true
  causal_only: true
  use_geometry_gate: false
